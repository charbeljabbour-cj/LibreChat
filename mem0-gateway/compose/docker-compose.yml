services:
  mem0-store:
    image: qdrant/qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - mem0_storage:/qdrant/storage

  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    volumes:
      - litellm_db:/var/lib/postgresql/data

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    env_file:
      - ./litellm.env
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    depends_on:
      - litellm-db
    ports:
      - "4000:4000"

  openmemory-api:
    image: openmemory-api-local
    build:
      context: ../vendor/mem0/openmemory/api
    restart: unless-stopped
    env_file:
      - ./openmemory.env
    environment:
      DATABASE_URL: sqlite:////data/openmemory.db
    volumes:
      - openmemory_db:/data
    depends_on:
      - mem0-store
      - litellm
    ports:
      - "8765:8765"

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/change-me
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  mem0-gateway:
    image: mem0-gateway-local
    build:
      context: ..
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci --omit=dev
        COPY src ./src
        EXPOSE 8001
        CMD ["node", "src/server.js"]
    env_file:
      - ../.env
      - ./litellm.env
    depends_on:
      - openmemory-api
      - litellm
    ports:
      - "8001:8001"

volumes:
  mem0_storage:
  openmemory_db:
  neo4j_data:
  litellm_db:
